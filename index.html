<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MonRevenu – Bienvenue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#5bcfff',
              mid:   '#1e90e8',
              dark:  '#0a52b8',
              pale:  '#a8e8ff',
            }
          },
          borderRadius: {
            phone: '2.75rem',
          },
          boxShadow: {
            phone: '0 28px 80px rgba(20,90,180,0.22)',
            btn:   '0 6px 20px rgba(26,127,232,0.3)',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    .wave-hero {
      background: linear-gradient(160deg, #5bcfff 0%, #1e90e8 45%, #0a52b8 100%);
    }
    .btn-signup-grad {
      background: linear-gradient(90deg, #1a7fe8, #3ab0ff);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-200 via-sky-100 to-blue-300 p-6">

  <!-- Phone frame -->
  <div class="relative w-80 bg-sky-50 rounded-phone border-[7px] border-white shadow-phone overflow-hidden flex flex-col">

    <!-- Notch -->
    <div class="w-16 h-4 bg-white/70 rounded-b-xl mx-auto z-10 relative"></div>

    <!-- Hero section -->
    <div class="wave-hero relative h-96 flex-shrink-0 overflow-hidden">

      <!-- Logo + Brand -->
      <div class="flex flex-col items-center pt-7 relative z-10">
        <svg width="68" height="64" viewBox="0 0 200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg1" x1="100" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffffff"/>
              <stop offset="1" stop-color="#a8e8ff"/>
            </linearGradient>
            <linearGradient id="lg2" x1="0" y1="100" x2="100" y2="190" gradientUnits="userSpaceOnUse">
              <stop stop-color="#a0c8f0"/>
              <stop offset="1" stop-color="#4a90d8"/>
            </linearGradient>
            <linearGradient id="lg3" x1="200" y1="100" x2="100" y2="190" gradientUnits="userSpaceOnUse">
              <stop stop-color="#d8f0ff"/>
              <stop offset="1" stop-color="#70c0f8"/>
            </linearGradient>
          </defs>
          <path d="M100 8 L192 168 H8 Z" fill="rgba(0,20,60,0.3)"/>
          <path d="M100 8 L116 38 L100 68 L84 38 Z" fill="url(#lg1)"/>
          <path d="M100 8 L192 168 L160 168 L100 60 Z" fill="url(#lg3)"/>
          <path d="M100 8 L8 168 L40 168 L100 60 Z" fill="url(#lg2)"/>
          <path d="M8 168 L56 168 L100 144 L144 168 L192 168 L160 168 L100 120 L40 168 Z" fill="url(#lg3)"/>
          <path d="M100 120 L160 168 L144 168 Z" fill="#c0e8ff" opacity="0.85"/>
          <path d="M100 120 L40 168 L56 168 Z" fill="#88c8f0" opacity="0.85"/>
        </svg>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-2xl font-bold text-white tracking-tight">
            Mon<span class="text-brand-pale">Revenu</span>
          </span>
        </div>
      </div>

      <!-- Sun -->
      <div class="absolute w-11 h-11 bg-white/85 rounded-full left-1/2 -translate-x-1/2 z-[2]" style="bottom: 138px;"></div>

      <!-- Waves SVG -->
      <svg class="absolute bottom-0 left-0 w-full z-[3]" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 60 Q40 30 80 55 Q120 80 160 50 Q200 20 240 45 Q280 65 320 40 L320 100 L0 100 Z" fill="rgba(255,255,255,0.2)"/>
        <path d="M0 70 Q50 45 100 65 Q150 85 200 58 Q250 32 320 60 L320 100 L0 100 Z" fill="rgba(255,255,255,0.4)"/>
        <path d="M0 80 Q60 60 120 75 Q180 90 240 68 Q280 55 320 75 L320 100 L0 100 Z" fill="#f0f8ff"/>
      </svg>

      <!-- Welcome text -->
      <div class="absolute bottom-12 left-0 right-0 text-center z-[4]">
        <p class="text-3xl font-bold text-white tracking-wide">Bienvenue</p>
        <p class="text-sm text-white/75 mt-1 tracking-wide">Vos finances, enfin sous contrôle</p>
      </div>

    </div>

    <!-- Bottom buttons -->
    <div class="flex-1 bg-sky-50 flex flex-col items-center justify-center px-6 py-7 gap-4">

      <button
        onclick="goToSignup()"
        class="btn-signup-grad w-full py-4 rounded-full text-white text-sm font-bold tracking-widest shadow-btn hover:opacity-90 active:scale-95 transition-all duration-150">
        CRÉER UN COMPTE
      </button>

      <button
        onclick="goToLogin()"
        class="w-full py-4 rounded-full bg-white text-blue-500 text-sm font-bold tracking-widest border border-blue-200 hover:bg-blue-50 active:scale-95 transition-all duration-150">
        SE CONNECTER
      </button>

      <p class="text-xs text-blue-300 text-center leading-relaxed mt-1">
        En continuant, vous acceptez nos
        <a href="#" class="text-blue-500 hover:underline">conditions</a>
        et notre
        <a href="#" class="text-blue-500 hover:underline">politique de confidentialité</a>
      </p>
    </div>
  </div>

  <script>
    function goToSignup() {
      alert('→ Rediriger vers la page d\'inscription');
    }
    function goToLogin() {
      alert('→ Rediriger vers la page de connexion');
    }
  </script>

</body>
</html>
