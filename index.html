<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1e90e8"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>MonRevenu – Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Google Sign-In SDK -->
  <!-- Remplacer YOUR_GOOGLE_CLIENT_ID par votre vrai Client ID depuis console.cloud.google.com -->
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-dark:  #0a3470;
      --blue-mid:   #1e90e8;
      --blue-light: #3ab0ff;
      --blue-pale:  #daeeff;
      --bg:         #f0f8ff;
      --white:      #ffffff;
      --text-main:  #0a3470;
      --text-sub:   #6aabcc;
      --err:        #dc2626;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Sora', sans-serif;
      background: var(--bg);
    }
    .page {
      width: 100vw; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HERO ── */
    .hero {
      flex-shrink: 0;
      background: linear-gradient(150deg, #5bcfff 0%, #1e90e8 50%, #0a52b8 100%);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding-top: max(36px, env(safe-area-inset-top, 36px));
      padding-bottom: 58px;
      min-height: 200px;
    }
    .hero-brand {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      position: relative; z-index: 5;
      animation: fadeDown .5s ease both;
    }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:none; } }
    .brand-name { font-size: clamp(24px,5vw,32px); font-weight: 800; color:#fff; letter-spacing:-0.5px; }
    .brand-name span { color: #a8e8ff; }
    .brand-sub { font-size:13px; color:rgba(255,255,255,.72); font-weight:500; }
    .deco { position:absolute; border-radius:50%; }
    .deco1 { width:80px; height:80px; background:rgba(255,255,255,.18); right:-18px; top:16px; }
    .deco2 { width:40px; height:40px; background:rgba(255,255,255,.13); left:20px; bottom:32px; }
    .wave-svg { position:absolute; bottom:-1px; left:0; width:100%; }

    /* ── CARD ── */
    .card-wrap {
      flex:1; overflow-y:auto;
      display:flex; flex-direction:column; align-items:center;
      padding: 0 20px calc(20px + env(safe-area-inset-bottom, 0px));
    }
    .card {
      width:100%; max-width:440px;
      background:var(--white); border-radius:24px;
      box-shadow:0 8px 40px rgba(26,127,232,.12);
      padding:30px 28px 28px;
      margin-top:-28px; position:relative; z-index:10;
      animation: slideUp .4s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
    .card-title { font-size:18px; font-weight:700; color:var(--text-main); margin-bottom:5px; }
    .card-hint  { font-size:12px; color:var(--text-sub); margin-bottom:24px; font-weight:500; }

    /* ── FIELDS ── */
    .field { margin-bottom:18px; }
    .field label {
      display:block; font-size:10.5px; color:var(--text-sub);
      font-weight:700; letter-spacing:.6px; text-transform:uppercase; margin-bottom:6px;
    }
    .field-row {
      display:flex; align-items:center; gap:10px;
      border:1.8px solid var(--blue-pale); border-radius:14px;
      padding:12px 14px; background:#f5faff;
      transition:border-color .2s, box-shadow .2s;
    }
    .field-row:focus-within {
      border-color:var(--blue-mid);
      box-shadow:0 0 0 4px rgba(30,144,232,.10);
      background:var(--white);
    }
    .field-icon { flex-shrink:0; width:20px; display:flex; align-items:center; justify-content:center; color:#90c8e8; }
    .field-row input {
      border:none; outline:none; flex:1;
      font-size:15px; font-family:'Sora',sans-serif;
      color:var(--text-main); background:transparent; min-width:0;
    }
    .field-row input::placeholder { color:#b8d8f0; }
    .eye-btn {
      background:none; border:none; cursor:pointer;
      color:#90c8e8; padding:0; line-height:1; flex-shrink:0;
      display:flex; align-items:center;
      transition:color .15s;
    }
    .eye-btn:hover { color:var(--blue-mid); }

    .forgot-row { text-align:right; margin-top:-8px; margin-bottom:20px; }
    .forgot-row a { font-size:12px; color:var(--blue-mid); font-weight:600; text-decoration:none; }

    .msg {
      font-size:12px; border-radius:12px; padding:10px 14px;
      text-align:center; font-weight:600; display:none; margin-bottom:14px;
    }
    .msg.err { color:var(--err); background:#fef2f2; border:1px solid #fecaca; }
    .msg.ok  { color:#059669;    background:#ecfdf5; border:1px solid #a7f3d0; }

    /* ── BOUTON PRINCIPAL ── */
    .btn-submit {
      width:100%; padding:15px;
      background:linear-gradient(90deg, #1a7fe8, #3ab0ff);
      box-shadow:0 6px 24px rgba(26,127,232,.32);
      color:#fff; border:none; border-radius:50px;
      font-size:14px; font-weight:700; letter-spacing:1.2px;
      font-family:'Sora',sans-serif; cursor:pointer;
      transition:opacity .15s, transform .13s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-submit:hover { opacity:.9; }
    .btn-submit:active { transform:scale(0.97); }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; }

    /* ── DIVIDER ── */
    .divider { display:flex; align-items:center; gap:10px; margin:20px 0 16px; }
    .divider-line { flex:1; height:1px; background:var(--blue-pale); }
    .divider-txt  { font-size:11px; color:#a8cce0; white-space:nowrap; }

    /* ── BOUTON GOOGLE (style officiel) ── */
    .btn-google {
      width:100%; display:flex; align-items:center; justify-content:center;
      gap:10px; padding:13px 16px; border-radius:14px;
      background:#fff; border:1.5px solid #dadce0;
      font-size:14px; font-weight:600; color:#3c4043;
      font-family:'Sora',sans-serif; cursor:pointer;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      transition:background .15s, box-shadow .15s;
      margin-bottom:12px;
    }
    .btn-google:hover { background:#f8f9fa; box-shadow:0 2px 8px rgba(0,0,0,.12); }
    .btn-google:active { transform:scale(0.98); }

    /* ── BOUTON FACEBOOK ── */
    .btn-facebook {
      width:100%; display:flex; align-items:center; justify-content:center;
      gap:10px; padding:13px 16px; border-radius:14px;
      background:#1877F2; border:none;
      font-size:14px; font-weight:600; color:#fff;
      font-family:'Sora',sans-serif; cursor:pointer;
      box-shadow:0 2px 8px rgba(24,119,242,.30);
      transition:background .15s, box-shadow .15s;
      margin-bottom:20px;
    }
    .btn-facebook:hover { background:#166fe5; }
    .btn-facebook:active { transform:scale(0.98); }

    .bottom-note { text-align:center; font-size:12px; color:var(--text-sub); font-weight:500; }
    .bottom-note a { color:var(--blue-mid); font-weight:700; text-decoration:none; }

    .legal { text-align:center; font-size:10.5px; color:#a8cce0; line-height:1.7; margin-top:14px; padding:0 4px; }
    .legal a { color:var(--blue-mid); text-decoration:none; }

    /* ── SPINNER ── */
    .spinner {
      width:16px; height:16px; flex-shrink:0;
      border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff; border-radius:50%;
      animation:spin .6s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<div class="page">

  <!-- ── HERO ── -->
  <div class="hero">
    <div class="deco deco1"></div>
    <div class="deco deco2"></div>
    <div class="hero-brand">
      <svg width="54" height="50" viewBox="0 0 200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="100" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#a8e8ff"/></linearGradient>
          <linearGradient id="lg2" x1="0" y1="100" x2="100" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#a0c8f0"/><stop offset="1" stop-color="#4a90d8"/></linearGradient>
          <linearGradient id="lg3" x1="200" y1="100" x2="100" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#d8f0ff"/><stop offset="1" stop-color="#70c0f8"/></linearGradient>
        </defs>
        <path d="M100 8 L192 168 H8 Z" fill="rgba(0,20,60,0.3)"/>
        <path d="M100 8 L116 38 L100 68 L84 38 Z" fill="url(#lg1)"/>
        <path d="M100 8 L192 168 L160 168 L100 60 Z" fill="url(#lg3)"/>
        <path d="M100 8 L8 168 L40 168 L100 60 Z" fill="url(#lg2)"/>
        <path d="M8 168 L56 168 L100 144 L144 168 L192 168 L160 168 L100 120 L40 168 Z" fill="url(#lg3)"/>
        <path d="M100 120 L160 168 L144 168 Z" fill="#c0e8ff" opacity="0.85"/>
        <path d="M100 120 L40 168 L56 168 Z" fill="#88c8f0" opacity="0.85"/>
      </svg>
      <div class="brand-name">Mon<span>Revenu</span></div>
      <div class="brand-sub">Vos finances, enfin sous contrôle</div>
    </div>
    <svg class="wave-svg" viewBox="0 0 400 56" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0 34 Q60 14 120 30 Q180 46 240 22 Q300 0 400 24 L400 56 L0 56 Z" fill="rgba(255,255,255,.18)"/>
      <path d="M0 42 Q80 24 160 38 Q230 52 300 30 Q350 14 400 36 L400 56 L0 56 Z" fill="rgba(255,255,255,.30)"/>
      <path d="M0 50 Q100 36 200 48 Q300 60 400 44 L400 56 L0 56 Z" fill="#f0f8ff"/>
    </svg>
  </div>

  <!-- ── CARD ── -->
  <div class="card-wrap">
    <div class="card">
      <div class="card-title">Connexion</div>
      <div class="card-hint">Entrez vos identifiants pour accéder à votre espace</div>

      <!-- Identifiant -->
      <div class="field">
        <label>Numéro de téléphone ou Email</label>
        <div class="field-row">
          <span class="field-icon">
            <!-- Icône enveloppe SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input type="text" id="loginId" placeholder="77 000 00 00 ou email@..." autocomplete="username" inputmode="text"/>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="field">
        <label>Mot de passe</label>
        <div class="field-row">
          <span class="field-icon">
            <!-- Icône cadenas SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="loginPwd" placeholder="••••••••" autocomplete="current-password"/>
          <button class="eye-btn" id="eyeBtn" onclick="togglePwd()" type="button" aria-label="Afficher/masquer le mot de passe">
            <!-- Icône œil SVG (ouvert) -->
            <svg id="iconEyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Icône œil SVG (barré) -->
            <svg id="iconEyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mot de passe oublié -->
      <div class="forgot-row">
        <a href="#">Mot de passe oublié ?</a>
      </div>

      <!-- Messages -->
      <div id="loginErr" class="msg err"></div>
      <div id="loginOk"  class="msg ok"></div>

      <!-- Bouton connexion -->
      <button class="btn-submit" id="btnLogin" onclick="handleLogin()">
        SE CONNECTER
      </button>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-txt">ou continuer avec</span>
        <div class="divider-line"></div>
      </div>

      <!-- ══ BOUTON GOOGLE SIGN-IN ══ -->
      <button class="btn-google" onclick="signInWithGoogle()">
        <!-- Logo Google officiel SVG -->
        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Continuer avec Google
      </button>

      <!-- ══ BOUTON FACEBOOK ══ -->
      <button class="btn-facebook" onclick="signInWithFacebook()">
        <!-- Logo Facebook officiel SVG -->
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97H15.83c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
        </svg>
        Continuer avec Facebook
      </button>

      <!-- Créer un compte -->
      <div class="bottom-note">
        Pas encore de compte ? <a href="register.html">Créer un compte</a>
      </div>

      <!-- Legal -->
      <p class="legal">
        En vous connectant, vous acceptez nos <a href="#">conditions d'utilisation</a>
        et notre <a href="#">politique de confidentialité</a>
      </p>
    </div>
  </div>
</div>


<script>
/* ══════════════════════════════════════════
   CONFIGURATION — À REMPLIR
   ══════════════════════════════════════════ */
const CONFIG = {
  // Depuis Google Cloud Console → APIs → Identifiants → Créer un ID client OAuth 2.0
  GOOGLE_CLIENT_ID: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com',
  // URL de votre script backend qui reçoit le token Google
  GOOGLE_BACKEND_URL: 'google_login.php',
  // URL de votre backend normal
  LOGIN_URL: 'login.php',
  // Page après connexion réussie
  DASHBOARD_URL: 'dashboard.php',
};

/* ══════════════════════════════════════════
   TOGGLE MOT DE PASSE
   ══════════════════════════════════════════ */
function togglePwd() {
  const inp = document.getElementById('loginPwd');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  document.getElementById('iconEyeOpen').style.display = show ? 'none' : 'block';
  document.getElementById('iconEyeOff').style.display  = show ? 'block' : 'none';
}

/* ══════════════════════════════════════════
   CONNEXION CLASSIQUE (tél/email + mdp)
   ══════════════════════════════════════════ */
function validateIdentifier(val) {
  if (!val) return false;
  if (val.includes('@')) return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  return /^[\d\s\-+]{6,20}$/.test(val);
}

function handleLogin() {
  const errEl = document.getElementById('loginErr');
  const okEl  = document.getElementById('loginOk');
  const btn   = document.getElementById('btnLogin');
  errEl.style.display = 'none';
  okEl.style.display  = 'none';

  const id  = document.getElementById('loginId').value.trim();
  const pwd = document.getElementById('loginPwd').value;

  if (!id || !pwd)              { showMsg(errEl, 'Veuillez renseigner tous les champs.'); return; }
  if (!validateIdentifier(id))  { showMsg(errEl, 'Numéro de téléphone ou email invalide.'); return; }
  if (pwd.length < 4)           { showMsg(errEl, 'Mot de passe trop court.'); return; }

  setLoading(btn, true);

  /* ── Décommentez pour le vrai backend ──
  fetch(CONFIG.LOGIN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ identifier: id, password: pwd })
  })
  .then(r => r.text())
  .then(resp => {
    if (resp.startsWith('redirect:')) {
      showMsg(okEl, '✓ Connexion réussie…');
      setTimeout(() => window.location.href = CONFIG.DASHBOARD_URL, 600);
    } else {
      showMsg(errEl, resp.trim() || 'Identifiants incorrects.');
      setLoading(btn, false);
    }
  })
  .catch(() => { showMsg(errEl, 'Erreur réseau. Réessayez.'); setLoading(btn, false); });
  */

  // Démo
  setTimeout(() => {
    showMsg(okEl, '✓ Connexion réussie !');
    setTimeout(() => window.location.href = CONFIG.DASHBOARD_URL, 900);
  }, 1000);
}

/* ══════════════════════════════════════════
   GOOGLE SIGN-IN
   ══════════════════════════════════════════

  Étapes pour activer :
  1. Allez sur https://console.cloud.google.com
  2. Créez un projet → APIs & Services → Identifiants
  3. Créer un ID client OAuth 2.0 → Application Web
  4. Ajoutez votre domaine dans "Origines JavaScript autorisées"
     (ex: https://monrevenu.com)
  5. Copiez l'ID client dans CONFIG.GOOGLE_CLIENT_ID ci-dessus
  6. Votre backend (google_login.php) reçoit le "credential" (JWT)
     et le vérifie avec la bibliothèque Google.
   ══════════════════════════════════════════ */
function signInWithGoogle() {
  if (typeof google === 'undefined') {
    showMsg(document.getElementById('loginErr'), 'Google Sign-In non disponible. Vérifiez votre connexion.');
    return;
  }

  const client = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'email profile openid',
    callback: (tokenResponse) => {
      if (tokenResponse.error) {
        showMsg(document.getElementById('loginErr'), 'Erreur Google : ' + tokenResponse.error);
        return;
      }
      // Envoyer le token à votre backend
      sendGoogleToken(tokenResponse.access_token);
    }
  });
  client.requestAccessToken();
}

/* Alternative : utiliser One Tap (popup automatique Google)
   Ajoutez ceci dans <body> pour activer la connexion One Tap :

   <div id="g_id_onload"
     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
     data-callback="handleGoogleCredential"
     data-auto_prompt="false">
   </div>

   function handleGoogleCredential(response) {
     sendGoogleToken(response.credential);
   }
*/

function sendGoogleToken(token) {
  const errEl = document.getElementById('loginErr');
  const okEl  = document.getElementById('loginOk');

  /* ── Décommentez pour le vrai backend ──
  fetch(CONFIG.GOOGLE_BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ google_token: token })
  })
  .then(r => r.text())
  .then(resp => {
    if (resp.startsWith('redirect:')) {
      showMsg(okEl, '✓ Connecté avec Google !');
      setTimeout(() => window.location.href = CONFIG.DASHBOARD_URL, 600);
    } else {
      showMsg(errEl, resp.trim() || 'Erreur Google. Réessayez.');
    }
  })
  .catch(() => showMsg(errEl, 'Erreur réseau.'));
  */

  // Démo
  showMsg(okEl, '✓ Connecté avec Google !');
  setTimeout(() => window.location.href = CONFIG.DASHBOARD_URL, 900);
}

/* ══════════════════════════════════════════
   FACEBOOK LOGIN
   ══════════════════════════════════════════ */
function signInWithFacebook() {
  const errEl = document.getElementById('loginErr');
  if (typeof FB === 'undefined') {
    showMsg(errEl, 'Facebook SDK non chargé. Ajoutez le SDK Facebook dans votre page.');
    return;
  }
  FB.login(function(response) {
    if (response.authResponse) {
      fetch(CONFIG.LOGIN_URL.replace('login', 'facebook_login'), {
        method: 'POST',
        body: new URLSearchParams({ fb_token: response.authResponse.accessToken })
      })
      .then(r => r.text())
      .then(resp => {
        if (resp.startsWith('redirect:')) {
          showMsg(document.getElementById('loginOk'), '✓ Connecté avec Facebook !');
          setTimeout(() => window.location.href = CONFIG.DASHBOARD_URL, 600);
        } else {
          showMsg(errEl, resp.trim() || 'Erreur Facebook.');
        }
      });
    } else {
      showMsg(errEl, 'Connexion Facebook annulée.');
    }
  }, { scope: 'public_profile,email' });
}

/* ══════════════════════════════════════════
   UTILS
   ══════════════════════════════════════════ */
function showMsg(el, txt) {
  el.textContent = txt;
  el.style.display = 'block';
}

function setLoading(btn, on) {
  if (on) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Connexion…';
  } else {
    btn.disabled = false;
    btn.innerHTML = 'SE CONNECTER';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
