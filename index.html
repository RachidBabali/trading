<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1e90e8"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>MonRevenu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    .app { width: 100vw; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .hero { flex: 1; background: linear-gradient(160deg, #5bcfff 0%, #1e90e8 45%, #0a52b8 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: max(48px, env(safe-area-inset-top, 48px)); }
    .bottom { flex-shrink: 0; background: #f0f8ff; padding: 2rem 1.8rem calc(2rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
    .btn-primary { background: linear-gradient(90deg, #1a7fe8, #3ab0ff); box-shadow: 0 6px 24px rgba(26,127,232,0.35); }
    button { transition: transform 0.13s, opacity 0.15s; cursor: pointer; border: none; outline: none; }
    button:active { transform: scale(0.97); }
    .wave-svg { position: absolute; bottom: 0; left: 0; width: 100%; }
    .sun { position: absolute; width: 56px; height: 56px; background: rgba(255,255,255,0.82); border-radius: 50%; left: 50%; transform: translateX(-50%); }
  </style>
</head>
<body>
<div class="app">

  <!-- HERO -->
  <div class="hero">

    <!-- Logo + Brand -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:10;">
      <svg width="72" height="68" viewBox="0 0 200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="100" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffffff"/><stop offset="1" stop-color="#a8e8ff"/>
          </linearGradient>
          <linearGradient id="lg2" x1="0" y1="100" x2="100" y2="190" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a0c8f0"/><stop offset="1" stop-color="#4a90d8"/>
          </linearGradient>
          <linearGradient id="lg3" x1="200" y1="100" x2="100" y2="190" gradientUnits="userSpaceOnUse">
            <stop stop-color="#d8f0ff"/><stop offset="1" stop-color="#70c0f8"/>
          </linearGradient>
        </defs>
        <path d="M100 8 L192 168 H8 Z" fill="rgba(0,20,60,0.3)"/>
        <path d="M100 8 L116 38 L100 68 L84 38 Z" fill="url(#lg1)"/>
        <path d="M100 8 L192 168 L160 168 L100 60 Z" fill="url(#lg3)"/>
        <path d="M100 8 L8 168 L40 168 L100 60 Z" fill="url(#lg2)"/>
        <path d="M8 168 L56 168 L100 144 L144 168 L192 168 L160 168 L100 120 L40 168 Z" fill="url(#lg3)"/>
        <path d="M100 120 L160 168 L144 168 Z" fill="#c0e8ff" opacity="0.85"/>
        <path d="M100 120 L40 168 L56 168 Z" fill="#88c8f0" opacity="0.85"/>
      </svg>
      <span style="font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.5px;">
        Mon<span style="color:#a8e8ff;">Revenu</span>
      </span>
    </div>

    <!-- Sun -->
    <div class="sun" style="bottom: clamp(100px, 22%, 180px);"></div>

    <!-- Welcome text above waves -->
    <div style="position:absolute;bottom:clamp(52px,12%,110px);left:0;right:0;text-align:center;z-index:5;">
      <p style="font-size:clamp(28px,6vw,42px);font-weight:700;color:#fff;letter-spacing:0.3px;">Bienvenue</p>
      <p style="font-size:clamp(13px,2.5vw,17px);color:rgba(255,255,255,0.75);margin-top:6px;">Vos finances, enfin sous contrôle</p>
    </div>

    <!-- Waves -->
    <svg class="wave-svg" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0 50 Q50 20 100 42 Q150 64 200 38 Q250 12 300 38 Q350 60 400 32 L400 90 L0 90 Z" fill="rgba(255,255,255,0.18)"/>
      <path d="M0 60 Q60 38 120 56 Q180 74 240 50 Q300 26 400 54 L400 90 L0 90 Z" fill="rgba(255,255,255,0.35)"/>
      <path d="M0 72 Q80 54 160 68 Q230 82 290 62 Q340 46 400 68 L400 90 L0 90 Z" fill="#f0f8ff"/>
    </svg>
  </div>

  <!-- BOTTOM BUTTONS -->
  <div class="bottom">
    <button
      onclick="window.location.href='signup.html'"
      class="btn-primary"
      style="width:100%;padding:clamp(14px,3vh,18px) 20px;border-radius:50px;color:#fff;font-size:clamp(13px,2vw,15px);font-weight:700;letter-spacing:1.2px;">
      CRÉER UN COMPTE
    </button>

    <button
      onclick="window.location.href='login.html'"
      style="width:100%;padding:clamp(14px,3vh,18px) 20px;border-radius:50px;background:#fff;color:#1a7fe8;font-size:clamp(13px,2vw,15px);font-weight:700;letter-spacing:1.2px;border:2px solid #b8deff;">
      SE CONNECTER
    </button>

    <p style="font-size:11px;color:#90b8d8;text-align:center;line-height:1.8;margin-top:4px;">
      En continuant, vous acceptez nos
      <a href="#" style="color:#1a7fe8;text-decoration:none;">conditions</a>
      et notre
      <a href="#" style="color:#1a7fe8;text-decoration:none;">politique de confidentialité</a>
    </p>
  </div>

</div>
</body>
</html>
