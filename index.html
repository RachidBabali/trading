<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRevenu - Accueil</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Effet de lueur (glow) personnalisé inspiré de la maquette */
        .glow-effect {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
        }
    </style>
</head>
<body class="bg-[#0b132b] text-white min-h-screen flex flex-col justify-between relative overflow-hidden">

    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-sky-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-blue-600/10 blur-[150px] pointer-events-none"></div>

    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <img src="image (13).jpg" alt="MonRevenu Logo" class="h-10 md:h-12 object-contain">
        </div>
        
        <div class="hidden sm:block">
            <span class="text-sm text-slate-400 hover:text-sky-400 transition cursor-pointer">Besoin d'aide ?</span>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto px-6 py-12 flex flex-col items-center justify-center text-center flex-grow z-10">
        
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-sm font-medium mb-8 animate-fade-in">
            <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
            La clé d'un avenir financier prospère
        </div>

        <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-4 leading-tight">
            Prenez le contrôle <br class="hidden md:block">
            de <span class="bg-gradient-to-r from-sky-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">vos finances</span>
        </h1>

        <p class="text-base md:text-xl text-slate-400 max-w-xl mb-12 font-light">
            Plus simple. Plus intelligent. Plus sûr. Rejoignez MonRevenu dès aujourd'hui et optimisez votre gestion financière.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md sm:max-w-none justify-center items-center">
            
            <button class="w-full sm:w-auto px-8 py-4 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 font-semibold text-white shadow-lg shadow-sky-500/20 hover:from-sky-400 hover:to-blue-500 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 glow-effect cursor-pointer text-center">
                Créer un compte
            </button>

            <button class="w-full sm:w-auto px-8 py-4 rounded-xl bg-transparent border border-sky-500/40 font-semibold text-sky-400 hover:bg-sky-500/10 hover:border-sky-400 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer text-center">
                Se connecter
            </button>
            
        </div>

    </main>

    <footer class="w-full text-center py-6 text-xs text-slate-500 z-10">
        &copy; 2026 MonRevenu. Tous droits réservés.
    </footer>

</body>
</html>
